# Generated by kennlint config from go.kenn.io/kit/lint/config.
# Put repository-specific additions in the overlay file; do not edit this file by hand.
version: "2"
run:
  tests: true
  timeout: 10m
  allow-parallel-runners: true
linters:
  default: none
  enable:
    # Correctness
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - nilnesserr
    - bodyclose
    - noctx
    - durationcheck
    - makezero
    - reassign
    - copyloopvar
    - usestdlibvars
    - iface
    - mirror
    - exptostd
    - usetesting
    - tparallel
    - testableexamples
    # Policy
    - forbidigo
    - importas
    - nolintlint
    - misspell
    - gocheckcompilerdirectives
    # kit analyzers (requires a custom golangci-lint build, see docs)
    - kennlint
    # Contexts derived inside loops and closures must not nest across
    # iterations.
    - fatcontext
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    testifylint:
      enable-all: true
      disable:
        # Identifier names do not prove that an assertion compares encoded data.
        - encoded-compare
    exhaustive:
      default-signifies-exhaustive: true
    usetesting:
      os-temp-dir: false
      context-background: true
      context-todo: true
      # Unix-socket and tmux fixtures need short /tmp roots; t.TempDir() is
      # too long for a socket path.
      os-mkdir-temp: false
      # Backlog: tests that set process-wide variables and directories
      # predate the shared policy.
      os-setenv: false
      os-chdir: false
    gocritic:
      # Only the bug-finding checks; style and opinionated tags are noise.
      enabled-tags:
        - diagnostic
      disabled-tags:
        - style
        - performance
        - experimental
        - opinionated
      disabled-checks:
        - filepathJoin
    misspell:
      ignore-rules:
        - importas
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    importas:
      no-unaliased: true
      alias:
        - pkg: github.com/stretchr/testify/assert
          alias: ""
        - pkg: github.com/stretchr/testify/require
          alias: ""
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^t\.(Fatal|Fatalf|Error|Errorf|Fail|FailNow)$'
          msg: Use testify assert/require helpers in tests.
        - pattern: '^testing\..+\.(Fatal|Fatalf|Error|Errorf|Fail|FailNow)$'
          msg: Use testify assert/require helpers in tests.
        - pattern: '^exec\.Command$'
          msg: Use exec.CommandContext so subprocesses honor cancellation.
        - pattern: '^http\.(Get|Post|Head|PostForm)$'
          msg: Build the request with http.NewRequestWithContext and a client with timeouts.
        - pattern: '^http\.DefaultClient$'
          msg: Construct an http.Client with explicit timeouts.
        - pattern: '^time\.Local$'
          msg: Keep stored and transported times in UTC; convert for display only.
        - pattern: '^os\.Chdir$'
          msg: Pass explicit paths or use cmd.Dir; the process working directory is shared state.
        - pattern: '^errors\.As$'
          msg: Use errors.AsType[E] for typed error extraction.
        - pattern: '^ioutil\..*$'
          msg: io/ioutil is deprecated; use io and os.
        - pattern: '^os\.Rename$'
          msg: Use atomicfile.Replace from go.kenn.io/kit, or atomicfile.RenameNoReplace when the target must not exist, so a Windows reader that opened the target with share-delete can't block the rename.
    custom:
      kennnolint:
        type: module
        description: Require a kit analyzer and reason in suppressions.
        original-url: go.kenn.io/kit/lint/nolintdirective
      kennlint:
        type: module
        description: kit analyzers for test discipline, error identity, and route registration.
        original-url: go.kenn.io/kit/lint
        settings:
          errtext:
            include-tests: false
          # Backlog from adopting the shared policy.
          disable: [sleeptest, deadlinetest, nohttpmux, errtext]
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests may drop errors from cleanup and helper calls.
      - linters:
          - errcheck
        path: _test\.go
      # Test files start subprocesses and requests against local fixtures.
      - linters:
          - forbidigo
        path: _test\.go
        text: (exec\.Command|http\.(Get|Post|Head|PostForm)|http\.DefaultClient)
      # Tests stage fixtures with plain renames.
      - linters:
          - forbidigo
        path: _test\.go
        text: atomicfile\.Replace
      # A main package owns process exit and may work without a caller context.
      - linters:
          - forbidigo
        path: ^(cmd/|main\.go)
        text: exec\.Command
      # Backlog from adopting the shared policy: these forbidigo patterns
      # predate it. The exec.Command and HTTP client patterns stay enforced.
      - linters:
          - forbidigo
        text: Use testify assert/require helpers in tests.
      - linters:
          - forbidigo
        text: Use errors.AsType\[E\] for typed error extraction.
      - linters:
          - forbidigo
        text: Use atomicfile.Replace from go.kenn.io/kit
      - linters:
          - forbidigo
        text: Pass explicit paths or use cmd.Dir
    paths:
      - third_party$
      - builtin$
      - examples$
      - testdata$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  # No goimports: gofumpt already enforces its std-first import grouping, and
  # missing or unused imports fail type checking. golangci-lint's goimports
  # rereads the whole module cache index for every file, and with it enabled
  # unchanged re-runs re-analyzed everything; it was most of a lint run.
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - testdata$
