# yaml-language-server: $schema=https://raw.githubusercontent.com/goreleaser/goreleaser/v2.17.1/www/docs/static/schema.json
version: 2

project_name: kwt

builds:
  - id: kwt
    main: ./cmd/kwt
    binary: kwt
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X go.kenn.io/kwt/internal/cmd.version={{ .Version }}
      - -X go.kenn.io/kwt/internal/cmd.commit={{ .Commit }}
      - -X go.kenn.io/kwt/internal/cmd.date={{ .CommitDate }}
      - -X go.kenn.io/kwt/internal/cmd.revisionTime={{ .CommitDate }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - ids:
      - kwt
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"

release:
  prerelease: auto
