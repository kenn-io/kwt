[project]
site_name = "kwt"
site_url = "https://kwt.sh/"
site_description = "A Git worktree manager for terminal-native, tmux-backed agentic engineering."
site_author = "Kenn Software LLC"
copyright = 'Copyright &copy; 2026 <a href="https://kenn.io">Kenn Software LLC</a>'
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/kenn-io/kwt"
repo_name = "kenn-io/kwt"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Start" = [
    { "Overview" = "index.md" },
    { "Quickstart" = "get-started/quickstart.md" },
  ] },
  { "Reference" = [
    { "CLI" = "reference/cli.md" },
    { "Pull-request automation" = "reference/pull-requests.md" },
    { "Configuration" = "reference/configuration.md" },
  ] },
  { "Workflows" = [
    { "Agent workspaces" = "workflows/agent-workspaces.md" },
    { "Directory workspaces" = "workflows/directory-workspaces.md" },
  ] },
  { "Multi-machine sync" = [
    { "Overview" = "multi-machine-sync.md" },
  ] },
  { "Design" = [
    { "Design notes" = "design/index.md" },
    { "TUI and project registry" = "design/tui-projects.md" },
    { "Multi-machine sync architecture" = "design/multi-machine-sync.md" },
  ] },
  { "Development" = [
    { "Contributing" = "development/contributing.md" },
    { "Threat model" = "development/threat-model.md" },
  ] },
]

[project.theme]
variant = "modern"
custom_dir = "overrides"
features = [
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.sections",
  "navigation.path",
  "content.action.edit",
  "content.code.copy",
]

[project.theme.palette]
scheme = "slate"
primary = "custom"
accent = "cyan"

[project.theme.icon]
repo = "fontawesome/brands/github"
edit = "lucide/pencil"
