[project]
site_name = "kwt"
site_url = "https://kwt.sh/"
site_description = "A Git worktree manager with a terminal dashboard for people and a scriptable CLI for agents and other tools."
site_author = "Kenn Software LLC"
copyright = 'Copyright &copy; 2026 <a href="https://kenn.io">Kenn Software LLC</a>'
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/kenn-io/kwt"
repo_name = "kenn-io/kwt"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Start" = [
    { "Overview" = "index.md" },
    { "Install" = "get-started/install.md" },
    { "Quickstart" = "get-started/quickstart.md" },
    { "Changelog" = "changelog.md" },
  ] },
  { "Workflows" = [
    { "Worktree lifecycle" = "workflows/worktree-maintenance.md" },
    { "Agent workspaces" = "workflows/agent-workspaces.md" },
    { "Directory workspaces" = "workflows/directory-workspaces.md" },
    { "Multi-machine sync" = "multi-machine-sync.md" },
  ] },
  { "Integrate" = [
    { "Embedding kwt" = "integrations/embedding.md" },
    { "CLI" = "reference/cli.md" },
    { "Pull-request automation" = "reference/pull-requests.md" },
    { "Configuration" = "reference/configuration.md" },
  ] },
  { "Project" = [
    { "Releases" = "releases.md" },
    { "Contributing" = "development/contributing.md" },
    { "Threat model" = "development/threat-model.md" },
    { "Releasing" = "development/releasing.md" },
    { "Design notes" = [
      { "Overview" = "design/index.md" },
      { "Local service daemon" = "design/daemon.md" },
      { "TUI and project registry" = "design/tui-projects.md" },
      { "Multi-machine sync architecture" = "design/multi-machine-sync.md" },
      { "Worktree maintenance" = "design/worktree-maintenance.md" },
      { "Worktree change inspection" = "design/worktree-changes.md" },
    ] },
  ] },
]

[project.theme]
variant = "modern"
custom_dir = "overrides"
features = [
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.sections",
  "navigation.path",
  "navigation.top",
  "content.action.edit",
  "content.code.copy",
]

[project.theme.palette]
scheme = "slate"
primary = "custom"
accent = "cyan"

[project.theme.icon]
repo = "fontawesome/brands/github"
edit = "lucide/pencil"
