name: Sibling pins on main

# A pull request may pin a sibling kenn-io repository's pull request build
# while both are open, but it may not merge until every pin is on that
# sibling's main. See https://github.com/kenn-io/actions/tree/main/sibling-pins.
#
# Run the shared checker on ordinary pull request and merge group events.
# It reads the candidate's dependency files. A repository ruleset requires
# this job, including in merge groups.
#
# Only a code change reruns this check: a new commit, or the pull request
# opening or reopening. Leave out `edited`. GitHub sends it for title,
# description, and base branch changes. Each edit started another run on the
# same commit, and GitHub reports the newest run's result, so a cancelled edit
# run blocked the merge. Do not skip edits with `if:` either. A skipped
# required job counts as passing and would hide a real failure.
# A base branch change does not rerun the check. Push a commit, or close and
# reopen the pull request, to check it against the new base.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-sibling-pins-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sibling-pins:
    name: Sibling pins on main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check sibling pins
        uses: kenn-io/actions/sibling-pins@main
