name: Workflow validation

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "**/action.yml"
      - "**/action.yaml"
      - ".github/actionlint.*"
      - ".github/jactionlint.*"
      - ".github/dependabot.yml"
      - ".github/dependabot.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-workflow-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: jdx/jactionlint@baa8d685e2b27ff5821558c9eeabb2051c1da61b # v2.4.0
        with:
          version: 2.4.0
          profile: default
          online: "false"
          args: "--shellcheck= --pyflakes="
