name: Workflow validation

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "**/action.yml"
      - "**/action.yaml"
      - ".github/actionlint.*"
      - ".github/jactionlint.*"
      - ".github/dependabot.yml"
      - ".github/dependabot.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-workflow-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/jactionlint@baa8d685e2b27ff5821558c9eeabb2051c1da61b # v2.4.0
        with:
          version: 2.4.0
          profile: default
          online: "false"
          args: "--shellcheck= --pyflakes="

  # The organization requires SHA-pinned actions. actions.lock pins every
  # action, including ones that other actions call, so a stale lockfile fails
  # jobs at setup.
  actions-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the workflow action lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: make actions-lock-check
