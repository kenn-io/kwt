name: CI

on:
  workflow_call:
  push:
    branches:
      - main
permissions:
  contents: read

env:
  # Module-relative source paths keep build cache entries independent of the checkout path.
  GOFLAGS: -trimpath

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            packages: ./...
          - os: macos-latest
            packages: ./...
          - os: windows-latest
            packages: >-
              ./cmd/kwt
              ./internal/cmd
              ./internal/command
              ./internal/discovery
              ./internal/duration
              ./internal/filesystem
              ./internal/finder
              ./internal/git
              ./internal/registry
              ./internal/shell
              ./internal/status
              ./internal/table
              ./internal/template
              ./internal/tmux
              ./internal/tui
              ./internal/ui
              ./internal/url
              ./internal/utils
              ./internal/worktree
              ./pkg/models
              ./worktree

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        if: runner.os != 'Windows'
        shell: bash
        env:
          TEST_PACKAGES: ${{ matrix.packages }}
          TEST_SUITE: ${{ matrix.os }}
        run: |
          results="$PWD/gotestsum"
          kwt_test_home="$RUNNER_TEMP/kwt-test-home"
          mkdir -p "$kwt_test_home"
          clean_env=(
            env -i
            "CGO_ENABLED=${CGO_ENABLED:-}"
            "GOCACHE=${GOCACHE:-}"
            "GOFLAGS=${GOFLAGS:-}"
            "GOARCH=${GOARCH:-}"
            "GOMODCACHE=${GOMODCACHE:-}"
            "GOPATH=${GOPATH:-}"
            "GOOS=${GOOS:-}"
            "GOROOT=${GOROOT:-}"
            "HOME=$HOME"
            "LANG=${LANG:-}"
            "LC_ALL=${LC_ALL:-}"
            "LC_CTYPE=${LC_CTYPE:-}"
            "NIX_SSL_CERT_FILE=${NIX_SSL_CERT_FILE:-}"
            "PATH=$PATH"
            "SSL_CERT_DIR=${SSL_CERT_DIR:-}"
            "SSL_CERT_FILE=${SSL_CERT_FILE:-}"
            "TMPDIR=${TMPDIR:-}"
            "XDG_CACHE_HOME=${XDG_CACHE_HOME:-}"
            GOAUTH=off
            GOENV=off
            GOPROXY=https://proxy.golang.org
            GOSUMDB=sum.golang.org
            GOTOOLCHAIN=auto
            'GOVCS=*:off'
            GIT_CONFIG_GLOBAL=/dev/null
            GIT_CONFIG_NOSYSTEM=1
            GIT_TERMINAL_PROMPT=0
          )
          # The bootstrap module stays dependency-free, so its tests run the
          # root module's gotestsum build from inside the bootstrap module.
          gotestsum="$("${clean_env[@]}" go tool -n gotestsum)"
          (
            cd tools/testbootstrap
            "${clean_env[@]}" "$gotestsum" \
              --format pkgname-and-test-fails --format-icons text \
              --jsonfile "$results/$TEST_SUITE-bootstrap.json" \
              --rerun-fails=2 \
              --rerun-fails-report "$results/$TEST_SUITE-bootstrap-reruns.txt" \
              --packages ./...
          )
          "${clean_env[@]}" "KWT_HOME=$kwt_test_home" \
            go -C tools/testbootstrap run . -- gotestsum \
              --format pkgname-and-test-fails --format-icons text \
              --jsonfile "$results/$TEST_SUITE.json" \
              --rerun-fails=2 \
              --rerun-fails-report "$results/$TEST_SUITE-reruns.txt" \
              --packages "$TEST_PACKAGES"

      - name: Test
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TEST_PACKAGES: ${{ matrix.packages }}
          TEST_SUITE: ${{ matrix.os }}
        run: |
          $testPackages = $env:TEST_PACKAGES
          $suite = $env:TEST_SUITE
          $results = Join-Path (Get-Location) 'gotestsum'
          $kwtTestHome = Join-Path $env:RUNNER_TEMP 'kwt-test-home'
          $gitConfig = Join-Path $env:RUNNER_TEMP 'kwt-test-gitconfig'
          New-Item -ItemType Directory -Force $kwtTestHome | Out-Null
          New-Item -ItemType File -Force $gitConfig | Out-Null

          $allowedNames = @(
            'APPDATA', 'CGO_ENABLED', 'COMSPEC', 'GOCACHE', 'GOARCH',
            'GOFLAGS', 'GOMODCACHE', 'GOPATH', 'GOOS', 'GOROOT', 'HOME', 'HOMEDRIVE',
            'HOMEPATH', 'LANG', 'LC_ALL', 'LC_CTYPE', 'LOCALAPPDATA',
            'NIX_SSL_CERT_FILE', 'PATH', 'PATHEXT', 'PROGRAMDATA',
            'SSL_CERT_DIR', 'SSL_CERT_FILE', 'SYSTEMROOT', 'TEMP', 'TMP',
            'TMPDIR', 'USERPROFILE', 'WINDIR', 'XDG_CACHE_HOME'
          )
          $allowed = @{}
          foreach ($name in $allowedNames) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($null -ne $value) {
              $allowed[$name] = $value
            }
          }
          Get-ChildItem Env: | Remove-Item
          foreach ($entry in $allowed.GetEnumerator()) {
            [Environment]::SetEnvironmentVariable($entry.Key, $entry.Value)
          }
          $env:GOAUTH = 'off'
          $env:GOENV = 'off'
          $env:GOPROXY = 'https://proxy.golang.org'
          $env:GOSUMDB = 'sum.golang.org'
          $env:GOTOOLCHAIN = 'auto'
          $env:GOVCS = '*:off'
          $env:GIT_CONFIG_GLOBAL = $gitConfig
          $env:GIT_CONFIG_NOSYSTEM = '1'
          $env:GIT_TERMINAL_PROMPT = '0'

          # The bootstrap module stays dependency-free, so its tests run the
          # root module's gotestsum build from inside the bootstrap module.
          $gotestsum = & go tool -n gotestsum
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location tools/testbootstrap
          & $gotestsum `
            --format pkgname-and-test-fails --format-icons text `
            --jsonfile (Join-Path $results "$suite-bootstrap.json") `
            --rerun-fails=2 `
            --rerun-fails-report (Join-Path $results "$suite-bootstrap-reruns.txt") `
            --packages ./...
          $bootstrapExit = $LASTEXITCODE
          Pop-Location
          if ($bootstrapExit -ne 0) { exit $bootstrapExit }
          $env:KWT_HOME = $kwtTestHome
          & go -C tools/testbootstrap run . -- gotestsum `
            --format pkgname-and-test-fails --format-icons text `
            --jsonfile (Join-Path $results "$suite.json") `
            --rerun-fails=2 `
            --rerun-fails-report (Join-Path $results "$suite-reruns.txt") `
            --packages $testPackages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test results
        if: failure() || github.run_attempt > 1 || hashFiles('gotestsum/*-reruns.txt') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gotestsum-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: gotestsum/*.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Build
        run: go build ./cmd/kwt

      - name: Cross-build Windows ARM64
        if: runner.os == 'Linux'
        run: GOOS=windows GOARCH=arm64 go build -o /tmp/kwt-windows-arm64.exe ./cmd/kwt

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check lint config
        run: make lint-config-check

      # The action builds the kit analyzers from .custom-gcl.yml.
      - name: golangci-lint
        uses: step-security/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Build docs
        run: make docs-install docs-check

      - name: Check first paint
        uses: kenn-io/actions/first-paint@main
        with:
          dist: docs/site
