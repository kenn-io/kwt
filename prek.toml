minimum_prek_version = "0.5.7"
default_install_hook_types = ["pre-push"]
default_stages = ["pre-commit"]

[[repos]]
repo = "local"
hooks = [
  { id = "golangci-lint", name = "make lint", entry = "make lint", language = "system", stages = ["pre-push"], types_or = ["go", "go-mod", "go-sum"], pass_filenames = false },
  { id = "golangci-lint-fmt", name = "golangci-lint fmt", entry = "golangci-lint fmt -d ./...", language = "system", stages = ["pre-push"], types_or = ["go"], pass_filenames = false },
  { id = "oxfmt", name = "oxfmt --check", entry = "oxfmt --check", language = "system", stages = ["pre-push"], types = ["markdown"], pass_filenames = true },
]
